site_name: BLIPSS
site_description: Breakthrough Listen Investigation for Periodic Spectral Signals
repo_url: https://github.com/UCBerkeleySETI/blipss

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }
  features:
    - content.code.copy
    - navigation.top

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - API Reference:
      - CLI: reference/cli.md
      - Core: reference/core.md
      - IO: reference/io.md
      - Models: reference/models.md
      - Plotting: reference/plotting.md
      - Utils: reference/utils.md
