[project]
name = "blipss"
version = "1.2.1"
description = "Breakthrough Listen Investigation for Periodic Spectral Signals"
authors = [{ name = "Akshay Suresh", email = "akshay721@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "blimpy>=2.1.4",
    "matplotlib>=3.10.6",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "riptide-ffa>=0.2.5",
    "tqdm>=4.67.3",
    "typer>=0.25.1",
]

[project.urls]
Repository = "https://github.com/UCBerkeleySETI/blipss"

[project.scripts]
compare-cands = "blipss.cli.compare_cands:app"
compute-phase-resolved-ds = "blipss.cli.compute_phase_resolved_ds:app"
inject-signal = "blipss.cli.inject_signal:app"
plot-cands = "blipss.cli.plot_cands:app"
run-ffa-search = "blipss.cli.run_ffa_search:app"
simulate-data = "blipss.cli.simulate_data:app"

[dependency-groups]
dev = [
    "astropy>=7.2.0",
    "deptry>=0.23.0",
    "hypothesis>=6.0.0",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=1.0.6",
    "mpi4py>=4.1.2",
    "pre-commit>=2.20.0",
    "pybind11>=3.0.4",
    "pytest>=7.2.0",
    "ruff>=0.11.5",
    "scipy>=1.17.1",
    # Capped below 82.0.0: blimpy 2.1.4 imports pkg_resources, removed in setuptools 82+.
    # Lift once UCBerkeleySETI/blimpy#281 lands in a release. See issue #10.
    "setuptools>=81.0.0,<82.0.0",
    "tox-uv>=1.11.3",
    "ty>=0.0.1a16",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.67.3.20260518",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blipss"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Long messages outside the exception class
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["blipss"]
relative_files = true
