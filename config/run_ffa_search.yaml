# Complete a search for periodic spectral signals in a set of input files.

input:
  # Path to data files
  data_dir: /Users/akshay/SETI/Data
  # Glob string to parse input files (filterbank or hdf5)
  glob_input: "sourceA_scan1.fil"
  # NOTE: If the channel bandwidth is negative, data are flipped along the radio frequency axis before slicing away edge channels.
  start_ch: null # All channels with indices less than this integer value will be ignored. (d: 0)
  stop_ch: null # All channels with indices larger than or equal to this integer value will be ignored. (d: len(data))

# By default, one .csv file of detected periodicity candidates will be saved to output_dir for every input file.
output:
  output_dir: /Users/akshay/SETI/Outputs  # Output path to be created if non-existent (d: data_dir)

plotting:
  do_plot: true  # Do you want to produce a summary plot showing candidates detected in the radio frequency - trial period plane? (True/ False) (d: False)
  plot_formats: null  # List of file formats for saving output plots (d: ['.png'])
  use_latex: true  # Render plot text with LaTeX; requires a system LaTeX installation (d: False)

ffa_search:
  min_period: 10.0  # Minimum trial folding period (s) for fast folding algorithm search (d: 10.0)
  max_period: 70.0  # Maximum trial folding period (s) for fast folding algorithm search (d: 100.0)
  fpmin: 3  # Minimum number of signal periods that must fit in the data. Place a cap on period_max equal to data_length / fpmin. (d: 3)
  snr_threshold: 7.0  # Threshold signal-to-noise ratio for peak detection in periodogram via matched filtering (d: 8.0)
  bins_min: 9  # Minimum no. of bins across folded profile. Minimum period/bins_min sets the duty cycle resolution of the search. (d: 10)
  bins_max: 10  # Maximum no. of bins across folded profile. Typically set to 10 percent larger than bins_min to maintain roughly uniform duty cycle resolution across periods. (d: 11)
  ducy_max: 0.5  # Max duty cycle of search (d: 0.5)
  do_deredden: false  # Do you want to deredden the time series before searching? (True/False) (d: False)
  rmed_width: 12.0  # Width (s) of running median filter used for dereddening. Set width > max_period/bins_min. (d: 12.0)
  epsilon_fof: 0.2 # Tolerance limit (s) for Friends-of-Friends clustering of candidate periods (d: 1.0e-3)
  epsilon_harmonic: 0.2 # Tolerance limit (s) for claiming a period is a harmonic/sub-harmonic of another (d: 1.0e-3)

resources:
  mem_load: 15.0  # Max data volume (GB) allowed to be read into memory (d: 1)
  n_workers: null  # Number of parallel worker processes for channel-wise FFA search; null uses all available CPUs (d: null)
