# Compare candidate periods across N files and output one N-digit binary code per candidate.
# In the binary code, "1" denotes detection and "0" denotes non-detection.
# ORDER MATTERS: Candidate detection in file i is denoted by "1" in the i^{th} position of the code (read from left to right).

candidate_files:
  csv_dir: /Users/akshay/SETI/Outputs  # Path to .csv files generated by blipss.py
  # List of .csv files (order matters)
  csv_list:
    - scan1_cands.csv
    - scan2_cands.csv
    - scan3_cands.csv
    - scan4_cands.csv
    - scan5_cands.csv
    - scan6_cands.csv

on_off_classification:
  # Specify whether the input .csv files represent 'ON' or 'OFF' pointings.
  labels: ["ON", "OFF", "ON", "OFF", "ON", "OFF"]
  on_cutoff: 7.0  # Signal-to-noise threshold for periodicity candidates detected in 'ON' pointings. (d: 8.0)
  off_cutoff: 6.0  # Signal-to-noise threshold for periodicity candidates detected in 'OFF' pointings. (d: 6.0)

output:
  basename: Xon_Yoff  # Basename of output .csv file
  output_dir: /Users/akshay/SETI/Results/Simulated  # Output path (will be created if non-existent)

candidate_grouping:
  cluster_radius: null  # Cluster radius (s) for grouping candidate periods using a Friends-of-Friends algorithm (d: 1.0e-3)
  n_jobs: null  # Worker processes for channel clustering (d: all available CPU cores). Set to 1 to run sequentially in-process.
