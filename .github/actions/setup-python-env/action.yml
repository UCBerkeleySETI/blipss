name: "Setup Python Environment"
description: "Set up Python environment using the version pinned in .python-version"

inputs:
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.6.14"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv-version }}
        # Caching disabled: riptide-ffa compiles its C++ extension with
        # -march=native, so a cached build reused on a different runner host
        # (different CPU feature set) can crash with "illegal instruction".
        enable-cache: 'false'

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash
